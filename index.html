<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la página llega hasta los bordes (el notch y la barra de abajo del iPhone se respetan con
         env(safe-area-inset-*)). interactive-widget: en Android, el teclado de pantalla encoge la página en vez de taparla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Chispa</title>
    <link rel="icon" href="imagenes/estrella.svg" />
  </head>
  <body>
    <!-- El editor (la página normal) -->
    <div id="editor" hidden></div>

    <!-- Las demos (?demo=1, ?demo=2, ?demo=0) -->
    <div id="pagina-demo" hidden>
      <div id="contenedor-juego">
        <canvas id="lienzo"></canvas>
      </div>
      <nav id="menu-demos">
        <a href="./">Editor</a>
        <a href="?demo=0" data-demo="0">Ejemplo</a>
        <a href="?demo=1" data-demo="1">Fase 1</a>
        <a href="?demo=2" data-demo="2">Fase 2</a>
      </nav>
      <!-- Lo que escribe "mostrar" en Chispa -->
      <div id="consola" hidden></div>
      <!-- Los errores del motor, en español -->
      <div id="panel-error" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
